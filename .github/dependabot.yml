version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-src-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/mysql"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-mysql-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/node"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-node-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5